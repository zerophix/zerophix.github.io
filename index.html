<!DOCTYPE html>
<html lang="zh-CN" data-ink="paper">
<head>

<meta property="og:site_name" content="ZeroPhix">
<meta property="og:title" content="ZeroPhix">
<meta property="og:description" content="">

<meta property="og:image:height" content="630">
<meta property="og:locale" content="zh_CN">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "ZeroPhix",
  "url": "https://zerophix.github.io/",

  "publisher": {
    "@type": "Person",
    "name": "ZeroPhix",
    "url": "https://github.com/zerophix"

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23f0ede6'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='21' font-weight='700' fill='%2327457e' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E">
<script>document.documentElement.classList.add('js');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=58cef4c0">
</head>
<body>

<div class="grain" aria-hidden="true"></div>
<div class="progress" id="progress" aria-hidden="true"></div>

<!-- ══════════ 报头 ══════════ -->
<header class="mast">
  <div class="wrap mast-in">
    <a class="brand" href="#top">
      <b data-site="brand">ZeroPhix</b><span class="tag">Personal Blog</span>
    </a>

    <nav class="nav" id="nav" aria-label="主导航">
      <a href="#fields">领域</a>
      <a href="#pages">页面</a>
      <a href="#about">关于</a>
    </nav>

    <div class="mast-right">
      <button class="tbtn" id="inkBtn" type="button" aria-pressed="false">夜读</button>
      <button class="tbtn menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="nav">菜单</button>
    </div>
  </div>
</header>

<main id="top">

  <!-- 无 JS 降级：领域墙与页面列表由脚本渲染，先给提示和静态导航 -->
  <noscript>
    <div class="wrap ns-wrap">
      <p class="empty ns-note">
        领域墙与页面列表由 JavaScript 渲染 · 请开启脚本后刷新
      </p>
      <p class="mono ns-nav">
        仍可直接前往：
        <a href="#fields">领域</a> ·
        <a href="#pages">页面</a> ·
        <a href="#about">关于</a>
      </p>
    </div>
  </noscript>

  <!-- ══════════ 开场（文案留白位） ══════════ -->
  <section class="intro">
    <div class="wrap">
      <div class="eyebrow">
        <span class="ln" aria-hidden="true"></span>
        <span class="mono" data-site="eyebrow">ZeroPhix · 2023 —</span>
      </div>

      <h1><span class="ln"><i>ZeroPhix</i></span></h1>

      <div class="acts">
        <a class="btn btn--fill" href="#fields">
          浏览领域
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
        <a class="btn btn--ghost" href="#pages">全部页面</a>
      </div>
    </div>
  </section>

  <!-- ══════════ 领域墙（pages/ 下的目录） ══════════ -->
  <section class="sec" id="fields">
    <div class="wrap">
      <div class="sec-h">
        <div class="l">
          <span class="mono">01 / Fields</span>
          <h2>领域</h2>
        </div>
      </div>
      <div class="fields" id="fields-wall"><noscript><p class="empty">领域墙需要 JavaScript · 请开启脚本</p></noscript></div>
    </div>
  </section>

  <!-- ══════════ 全部页面（按领域分组） ══════════ -->
  <section class="sec" id="pages">
    <div class="wrap">
      <div class="sec-h">
        <div class="l">
          <span class="mono">02 / Pages</span>
          <h2>全部页面</h2>
        </div>
      </div>
      <div id="pageList"><noscript><p class="empty">页面列表需要 JavaScript · 请开启脚本</p></noscript></div>
    </div>
  </section>

  <!-- ══════════ 关于（正文留白位） ══════════ -->
  <section class="sec" id="about">
    <div class="wrap">
      <div class="sec-h">
        <div class="l">
          <span class="mono">03 / About</span>
          <h2>关于</h2>
        </div>
      </div>

      <div class="about-grid">
        <div class="about"></div>

        <dl class="colophon">
          <div><dt>博客 / Site</dt><dd><b data-site="brand">ZeroPhix</b><br><span data-site="since">2023—</span></dd></div>
          <div><dt>技术 / Stack</dt><dd>纯 HTML · CSS · JavaScript<br>Eleventy 挂载 · 无打包器</dd></div>
          <div><dt>字体 / Type</dt><dd>Noto Serif SC<br>JetBrains Mono</dd></div>
        </dl>
      </div>
    </div>
  </section>

</main>

<footer class="foot">
  <div class="wrap">
    <div class="foot-in">
      <div class="foot-links">
        <a href="#fields">领域 / Fields</a>
        <a href="https://github.com/zerophix" target="_blank" rel="noopener" data-site-href="github">GitHub</a>
        <a href="mailto:zerophix@users.noreply.github.com" data-site-href="email">联系 / Email</a>
        <a href="#top">回到顶部 / Top</a>
      </div>
      <p class="mono" data-site="brandline">ZeroPhix</p>
    </div>
  </div>
</footer>

<script src="theme.js?v=474ec528"></script>
<script src="app.js?v=009ae0f0"></script>

</body>
</html>
